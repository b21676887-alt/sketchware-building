plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    compileSdk = 36

    // Resolve the git hash defensively: the build must not fail when git is not
    // installed or the project was downloaded as a ZIP (no .git directory).
    def gitCommitHash = "unknown"
    def shortCommitHash = "unknown"
    try {
        def proc = "git rev-parse HEAD".execute(null, projectDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            gitCommitHash = proc.text.trim()
            shortCommitHash = gitCommitHash.take(7)
        }
    } catch (Exception ignored) {
        // git unavailable — keep "unknown"
    }

    defaultConfig {
        applicationId = "pro.sketchware"
        namespace = "pro.sketchware"
        //noinspection ExpiredTargetSdkVersion since we don't target getting Sketchware Pro on Google Play.
        targetSdk = 28
        minSdk = 26
        versionCode = 160
        versionName = "v7.0.0-beta9"

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")
        buildConfigField("String", "SKETCHUB_API_KEY", "\"${System.getenv("SKETCHUB_API_KEY")}\"")
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += "license/*"
            excludes += "META-INF/DEPENDENCIES"
            pickFirsts += "api_database/*"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    signingConfigs {
        debug {
            storeFile = file("../testkey.keystore")
            storePassword = "testkey"
            keyAlias = "testkey"
            keyPassword = "testkey"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    testImplementation libs.junit

    implementation libs.bundles.ui

    implementation libs.bundles.image

    implementation platform(libs.sora.editor)
    implementation libs.bundles.editor.and.lang

    implementation libs.bundles.coil

    implementation libs.bundles.bundletool
    implementation(libs.sdklib) {
        exclude group: "com.intellij", module: "annotations"
    }

    implementation libs.bundles.shrinker
    implementation libs.zipalign.java

    implementation libs.gson
    implementation libs.scpkix.jdk15on

    implementation libs.markwon

    implementation libs.bundles.networking

    implementation libs.ecj
    implementation libs.stax.api

    implementation libs.bundles.kotlin.compiler
    compileOnly libs.kotlin.compiler

    implementation project(':resolver')
    implementation project(':vendor-dx')
    implementation libs.filepicker

    implementation libs.libsu
    implementation libs.insetter

    // User Messaging Platform
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'

    testImplementation "org.json:json:20240303"

    implementation(libs.javaparser.symbol.solver) {
        exclude group: "com.google.guava", module: "guava"
    }

    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-database"
    implementation libs.bundles.firebase

    coreLibraryDesugaring libs.desugar.jdk.libs.nio
}

// Create or write google-services.json automatically if provided, otherwise create a mock file
tasks.register('createMockGoogleServices') {
    doLast {
        def secretProp = project.hasProperty("secrets") ? project.property("secrets") : null
        def secretEnv = System.getenv("GOOGLE_SERVICES_JSON") ?: System.getenv("SECRETS")
        def secretsContent = (secretProp ?: secretEnv)?.toString()

        def destFile = file("${projectDir}/google-services.json")

        if (secretsContent) {
            destFile.parentFile?.mkdirs()
            destFile.text = secretsContent
            println "Wrote google-services.json from provided secrets to ${destFile}"
            return
        }

        if (!destFile.exists()) {
            def mockContent = """{
  "project_info": {
    "project_number": "123456789000",
    "firebase_url": "https://mock-project-default-rtdb.firebaseio.com",
    "project_id": "mock-project",
    "storage_bucket": "mock-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789000:android:mockappid123456",
        "android_client_info": {
          "package_name": "${android.defaultConfig.applicationId}"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "mock_AIzaSyBQJCUXVKUjD38-u5pWkqMtesIfFvxAcvs"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}"""
            destFile.parentFile?.mkdirs()
            destFile.text = mockContent
            println "Created mock google-services.json at ${destFile}"
        } else {
            println "google-services.json already exists at ${destFile}"
        }
    }
}

preBuild.dependsOn createMockGoogleServices
