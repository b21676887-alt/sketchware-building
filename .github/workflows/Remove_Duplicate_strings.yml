name: Remove Duplicate Strings Keys

on:
  push:
    branches:
      - '**'
    paths:
      - '**/strings.xml'
  workflow_dispatch:

jobs:
  clean-duplicates:
    name: Clean Duplicate Keys
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Remove Duplicate Keys from strings.xml
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ET

          # البحث عن ملف strings.xml
          files = glob.glob('**/strings.xml', recursive=True)

          if files:
              file_path = files[0]
              print(f"Processing duplicate keys in {file_path}...")
              
              tree = ET.parse(file_path)
              root = tree.getroot()

              seen_names = set()
              duplicates_count = 0

              for elem in list(root):
                  if elem.tag == 'string':
                      name = elem.get('name')
                      if name in seen_names:
                          root.remove(elem)
                          duplicates_count += 1
                      else:
                          seen_names.add(name)

              if duplicates_count > 0:
                  tree.write(file_path, encoding='utf-8', xml_declaration=True)
                  print(f"Successfully removed {duplicates_count} duplicate key(s).")
              else:
                  print("No duplicate keys found.")
          else:
              print("Warning: strings.xml file not found.")

      - name: Commit and Push Cleaned Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: Remove duplicate keys from strings.xml [skip ci]" || echo "No changes to commit"
          git push
