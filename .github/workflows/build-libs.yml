name: Build and Verify Built-in Libraries

on:
  push:
    paths:
      - 'tools/builtin-libs/**'
      - 'app/src/main/java/pro/sketchware/util/library/BuiltInLibraries.java'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build-libs:
    name: Build & Verify Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: Configure Android environment
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.android-home }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_HOME"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Install Required Android SDK Packages
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.android-home }}
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # إذا كان cmdline-tools غير موجود، نقوم بتثبيته يدويًا من الموقع الرسمي
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"

            curl -fsSL \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/commandlinetools.zip

            unzip -q /tmp/commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          echo "Installing required SDK packages..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Run Build Built-in Libraries Script
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.android-home }}
        shell: bash
        run: |
          set -euxo pipefail
          python tools/builtin-libs/build_builtin_libs.py

      - name: Verify Resources Compatibility
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.android-home }}
        shell: bash
        run: |
          set -euxo pipefail
          python tools/builtin-libs/verify_resources.py

      - name: Verify Classes and Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python tools/builtin-libs/verify_classes.py

      - name: Verify Generated Code and Smoke Tests
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
          ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.android-home }}
        shell: bash
        run: |
          set -euxo pipefail
          python tools/builtin-libs/verify_generated_code.py

      - name: Commit and Push Updated Libraries and Assets
        shell: bash
        run: |
          set -euxo pipefail

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"

          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}" || git pull --rebase origin "${BRANCH}" || true

          git status
          git add app/src/main/assets/libs/ app/src/main/java/pro/sketchware/util/library/BuiltInLibraries.java

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update built-in libraries and assets [skip ci]"
            git push origin HEAD:"${BRANCH}"
          fi
