name: Build and Verify Built-in Libraries

on:
  push:
    paths:
      - 'tools/builtin-libs/**'
      - 'app/src/main/java/pro/sketchware/util/library/BuiltInLibraries.java'
  workflow_dispatch:

jobs:
  build-libs:
    name: Build & Verify Libraries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Packages
        shell: bash
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run Build Built-in Libraries Script
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          python tools/builtin-libs/build_builtin_libs.py

      - name: Verify Resources Compatibility
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          python tools/builtin-libs/verify_resources.py

      - name: Verify Classes and Dependencies
        run: |
          python tools/builtin-libs/verify_classes.py

      - name: Verify Generated Code and Smoke Tests
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          python tools/builtin-libs/verify_generated_code.py

      - name: Commit and Push Updated Libraries and Assets
        shell: bash
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"

          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}" || git pull --rebase origin "${BRANCH}" || true

          git status
          git add app/src/main/assets/libs/ app/src/main/java/pro/sketchware/util/library/BuiltInLibraries.java

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update built-in libraries and assets [skip ci]"
            git push origin HEAD:"${BRANCH}"
          fi
